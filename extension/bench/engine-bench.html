<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Engine bench</title>
    <style>
      body { margin: 16px; font: 14px/1.4 system-ui, sans-serif; }
      textarea { display: block; width: 100%; height: 120px; margin: 8px 0; }
      pre { background: #f3f3f3; padding: 8px; white-space: pre-wrap; }
    </style>
    <script type="module" src="./engine-bench.ts"></script>
  </head>
  <body>
    <h1>Engine bench</h1>
    <p>Reviews one game with each search limit in turn. Keep this tab in front while it runs.</p>
    <select id="game"></select>
    <textarea id="pgn" aria-label="PGN"></textarea>
    <button id="run" type="button">Run</button>
    <button id="parallel" type="button">Run parallel</button>
    <pre id="output"></pre>
  </body>
</html>
