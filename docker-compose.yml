# Chess Review backend: the API and MS SQL.
#
#   cp .env.example .env        # then set the password in .env
#   docker compose up --wait --build
#   curl http://localhost:8080/healthz

name: chess-review

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      # Express is free for production use; the default Developer edition is not.
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      # Loopback only: lets the API run from Visual Studio against this database.
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: backend
      dockerfile: ChessReview.Api/Dockerfile
    environment:
      ConnectionStrings__ChessReview: Server=mssql;Database=ChessReview;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
      Database__MigrateOnStartup: "true"
      Gemini__ApiKey: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mssql-data:
