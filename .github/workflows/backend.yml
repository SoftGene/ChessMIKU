name: backend

on:
  # Every pull request, without a paths filter: build-and-test is a required check on main,
  # and a check skipped by a filter never reports, which blocks the merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'global.json'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ChessReview.sln

      - name: Build
        run: dotnet build backend/ChessReview.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/ChessReview.sln --no-build --configuration Release
